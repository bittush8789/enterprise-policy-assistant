services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-policy-assistant
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data/policies:/app/data/policies:ro
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
    name: sentinel_chroma_data
